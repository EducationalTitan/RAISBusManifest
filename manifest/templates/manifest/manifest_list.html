{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Submitted Bus Manifests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Bus Manifests</h2>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Date</th>
                <th>Driver</th>
                <th>Route</th>
                <th>Morning</th>
                <th>Afternoon</th>
                <th>Children Picked</th>
            </tr>
        </thead>
        <tbody>
            {% for item in manifests %}
                <tr>
                    <td>{{ item.date }}</td>
                    <td>{{ item.driver_name }}</td>
                    <td>{{ item.bus_route }}</td>
                    <td>{{ item.morning_trip }}</td>
                    <td>{{ item.afternoon_trip }}</td>
                    <td>{{ item.number_of_children_picked }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
<a href="{% url 'home' %}">
    <button style="padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">
        ⬅ Back to Home
    </button>
</a>
</body>
</html>
