{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bus Manifest | RAIS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">

    <div class="container py-5">

        <!-- Header and Logo -->
        <div class="text-center mb-4">
            <img src="{% static 'images/RAIS_logo.png' %}" alt="RAIS Logo" width="100" class="mb-2">
            <h1 class="text-primary fw-bold">RAIS Bus Manifest</h1>
            <p class="text-muted">Record your daily transport log below</p>
        </div>

        <!-- Form Card -->
        <div class="card shadow-lg rounded-4 p-4 mx-auto" style="max-width: 700px;">
            <h4 class="mb-4 text-success text-center">Bus Manifest Form</h4>

            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <div class="form-text">{{ field.help_text }}</div>
                        {% endif %}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-success w-100 mt-3">Submit Manifest</button>
            </form>
        </div>

    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
